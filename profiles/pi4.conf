# shellcheck shell=bash
# ============================================================
# Board profile: Raspberry Pi 4
# Sourced by scripts/install.sh and scripts/system-setup.sh.
# See docs/configuration.md for what every key means.
# ============================================================

BOARD_ID="pi4"
BOARD_NAME="Raspberry Pi 4"
# Matched (as a substring) against /proc/device-tree/model for auto-detection.
DT_MODEL_MATCH="Raspberry Pi 4"

# ------------------------------------------------------------
# Audio — Google VoiceHAT
# ------------------------------------------------------------
ALSA_CARD="sndrpigooglevoi"
ALSA_HW_DEVICE="hw:sndrpigooglevoi,0"
ALSA_PLAYBACK_CHANNELS=2
# 1 = insert softvol (Master) and micboost (MicMaster) layers; the VoiceHAT has
# no hardware mixer, so without these there is nothing for alsamixer to move.
AUDIO_SOFTVOL=1
AUDIO_DRIVER_REPO=""
AUDIO_DRIVER_STATE=""

# ------------------------------------------------------------
# Firmware — /boot/firmware/config.txt
# Entries are "key|value"; an empty value writes a bare line.
# ------------------------------------------------------------
FIRMWARE_SETTINGS=(
    "dtparam=audio|off"
    "dtoverlay=googlevoicehat-soundcard|"
    "gpu_mem|256"
    "dtoverlay=ov5647|"
    "dtoverlay=dwc2,dr_mode=peripheral|"
    "dtparam=spi|on"
    "dtparam=i2c_arm|on"
    "dtparam=i2s|on"
)
VC4_NOAUDIO=0

# ------------------------------------------------------------
# Storage / memory — 4 GB of headroom for the llama.cpp build and model load
# ------------------------------------------------------------
SWAP_FIXED_MIB=4096
TMP_REMOUNT="4G"

# ------------------------------------------------------------
# Inference
# ------------------------------------------------------------
LLM_MODEL_FILE="qwen2.5-0.5b-instruct-q4_k_m.gguf"
LLM_MODEL_URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
LLM_CTX=2048
LLM_THREADS=4

# ------------------------------------------------------------
# Runtime — written into the deployed .env
# ------------------------------------------------------------
SAMPLE_RATE=16000
PROMPT_FORMAT="chatml"

# RAG is off: ChromaDB plus a sentence-transformers model does not fit
# alongside the LLM in 4 GB.
FEATURE_RAG=0
FEATURE_VISION=1
FEATURE_BATTERY=1
FEATURE_TOOLS=0

# ------------------------------------------------------------
# Python environment
# ------------------------------------------------------------
# picamera2 ships as a system package, hence --system-site-packages below.
EXTRA_APT="python3-libcamera python3-picamera2 i2c-tools"
REQUIREMENTS_FILE="requirements-pi4.txt"
VENV_SYSTEM_SITE_PACKAGES=1
