# shellcheck shell=bash
# ============================================================
# Board profile: Raspberry Pi 5
# Sourced by scripts/install.sh and scripts/system-setup.sh.
# See docs/configuration.md for what every key means.
# ============================================================

BOARD_ID="pi5"
BOARD_NAME="Raspberry Pi 5"
# Matched (as a substring) against /proc/device-tree/model for auto-detection.
DT_MODEL_MATCH="Raspberry Pi 5"

# ------------------------------------------------------------
# Audio — Raspiaudio Pi Audio Drive
# ------------------------------------------------------------
ALSA_CARD="Zero"
ALSA_HW_DEVICE="hw:Zero,0"
# Blank means the dmix slave block omits an explicit channel count.
ALSA_PLAYBACK_CHANNELS=""
# 0 = route straight to the dmix/dsnoop layer, no software volume controls.
AUDIO_SOFTVOL=0
AUDIO_DRIVER_REPO="https://github.com/RASPIAUDIO/Pi-Audio-Drive"
AUDIO_DRIVER_STATE="MIC_HP_SPK"

# ------------------------------------------------------------
# Firmware — /boot/firmware/config.txt
# Entries are "key|value"; an empty value writes a bare line.
# ------------------------------------------------------------
FIRMWARE_SETTINGS=(
    "dtparam=audio|off"
    "dtoverlay=rpi-codeczero|"
    "dtparam=pciex1_gen|3"
)
# Append ,noaudio to the vc4-kms-v3d overlay so HDMI does not claim a card index.
VC4_NOAUDIO=1

# ------------------------------------------------------------
# Storage / memory
# ------------------------------------------------------------
# Blank leaves swap disabled (swapoff only).
SWAP_FIXED_MIB=""
# Blank skips the /tmp remount.
TMP_REMOUNT=""

# ------------------------------------------------------------
# Inference
# ------------------------------------------------------------
LLM_MODEL_FILE="gemma-4-E4B-it-Q4_K_M.gguf"
LLM_MODEL_URL="https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_K_M.gguf"
LLM_CTX=4096
LLM_THREADS=4

# ------------------------------------------------------------
# Runtime — written into the deployed .env
# ------------------------------------------------------------
SAMPLE_RATE=48000
PROMPT_FORMAT="gemma"

FEATURE_RAG=1
FEATURE_VISION=0
FEATURE_BATTERY=0
FEATURE_TOOLS=1

# ------------------------------------------------------------
# Python environment
# ------------------------------------------------------------
EXTRA_APT=""
REQUIREMENTS_FILE="requirements-pi5.txt"
VENV_SYSTEM_SITE_PACKAGES=0
